<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Billing - CarePlus Hospital</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="bi bi-hospital"></i> CarePlus Hospital
        </a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="page-header">
        <h1>Hospital Billing</h1>
        <p>Generate patient bills.</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <form id="billingForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label>Patient Name</label>
                <input
                  type="text"
                  id="billPatient"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Patient ID</label>
                <input
                  type="text"
                  id="billPatientId"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-3">
                <label>Consultation Fee</label>
                <input
                  type="number"
                  id="consultation"
                  class="form-control"
                  value="500"
                />
              </div>

              <div class="col-md-3">
                <label>Medicine Fee</label>
                <input
                  type="number"
                  id="medicine"
                  class="form-control"
                  value="0"
                />
              </div>

              <div class="col-md-3">
                <label>Room Charges</label>
                <input type="number" id="room" class="form-control" value="0" />
              </div>

              <div class="col-md-3">
                <label>Other Charges</label>
                <input
                  type="number"
                  id="other"
                  class="form-control"
                  value="0"
                />
              </div>
            </div>

            <div class="bill-total mt-4">
              <h4>Total Amount</h4>

              <h1>₹ <span id="totalBill">500</span></h1>
            </div>

            <button
              type="button"
              onclick="calculateBill()"
              class="btn btn-primary mt-3"
            >
              Calculate
            </button>

            <button
              type="button"
              onclick="window.print()"
              class="btn btn-success mt-3"
            >
              <i class="bi bi-printer"></i> Print Bill
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
