<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patients - CarePlus Hospital</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
          <i class="bi bi-hospital"></i> CarePlus Hospital
        </a>
        <a href="index.html" class="btn btn-light">Home</a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="page-header">
        <h1>Patient Management</h1>
        <p>Add and manage hospital patients.</p>
      </div>

      <div id="patientMessage"></div>

      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Add New Patient</h5>
        </div>

        <div class="card-body">
          <form id="patientForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label>Patient ID</label>
                <input
                  type="text"
                  id="patientId"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Patient Name</label>
                <input
                  type="text"
                  id="patientName"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-4">
                <label>Age</label>
                <input
                  type="number"
                  id="patientAge"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-4">
                <label>Gender</label>
                <select id="patientGender" class="form-select" required>
                  <option value="">Select</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="col-md-4">
                <label>Blood Group</label>
                <select id="bloodGroup" class="form-select">
                  <option>A+</option>
                  <option>A-</option>
                  <option>B+</option>
                  <option>B-</option>
                  <option>AB+</option>
                  <option>AB-</option>
                  <option>O+</option>
                  <option>O-</option>
                </select>
              </div>

              <div class="col-md-6">
                <label>Phone</label>
                <input
                  type="tel"
                  id="patientPhone"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Email</label>
                <input type="email" id="patientEmail" class="form-control" />
              </div>

              <div class="col-md-6">
                <label>Address</label>
                <input type="text" id="patientAddress" class="form-control" />
              </div>

              <div class="col-md-6">
                <label>Disease</label>
                <input type="text" id="patientDisease" class="form-control" />
              </div>
            </div>

            <button class="btn btn-primary mt-4">
              <i class="bi bi-person-plus"></i> Add Patient
            </button>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header">
          <div class="d-flex justify-content-between align-items-center">
            <h5>Patient List</h5>

            <input
              type="search"
              id="patientSearch"
              class="form-control search-box"
              placeholder="Search patient..."
            />
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-primary">
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Blood</th>
                <th>Phone</th>
                <th>Disease</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="patientTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
