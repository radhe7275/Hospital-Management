<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Appointments - CarePlus Hospital</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="bi bi-hospital"></i> CarePlus Hospital
        </a>
      </div>
    </nav>

    <div class="container py-5">
      <div class="page-header">
        <h1>Appointment Management</h1>
        <p>Book and manage patient appointments.</p>
      </div>

      <div id="appointmentMessage"></div>

      <div class="card shadow-sm mb-5">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Book Appointment</h5>
        </div>

        <div class="card-body">
          <form id="appointmentForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label>Patient Name</label>
                <input
                  type="text"
                  id="appointmentPatient"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label>Doctor</label>
                <select id="appointmentDoctor" class="form-select" required>
                  <option value="">Select Doctor</option>
                  <option>Dr. Amit Sharma</option>
                  <option>Dr. Priya Verma</option>
                  <option>Dr. Rahul Singh</option>
                  <option>Dr. Neha Gupta</option>
                  <option>Dr. Anjali Mehta</option>
                  <option>Dr. Vikash Kumar</option>
                </select>
              </div>

              <div class="col-md-4">
                <label>Department</label>
                <select id="appointmentDepartment" class="form-select">
                  <option>Cardiology</option>
                  <option>Neurology</option>
                  <option>Orthopedics</option>
                  <option>Dermatology</option>
                  <option>Pediatrics</option>
                  <option>General Medicine</option>
                </select>
              </div>

              <div class="col-md-4">
                <label>Date</label>
                <input
                  type="date"
                  id="appointmentDate"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-4">
                <label>Time</label>
                <input
                  type="time"
                  id="appointmentTime"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-12">
                <label>Reason for Visit</label>
                <textarea
                  id="appointmentReason"
                  class="form-control"
                  rows="3"
                ></textarea>
              </div>
            </div>

            <button class="btn btn-primary mt-4">
              <i class="bi bi-calendar-plus"></i> Book Appointment
            </button>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header">
          <h5>Appointments</h5>
        </div>

        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-primary">
              <tr>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Department</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="appointmentTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
